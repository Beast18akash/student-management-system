name: Student Management System CI

'on':
  push:
    branches:
      - main
      - feature/student-email-validation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f index.html
          test -f README.md
          echo "All project files exist!"

      - name: Validate HTML structure
        shell: bash
        run: |
          set -e
          grep -Eiq '<!doctype html>' index.html
          grep -Eiq '<html([[:space:]>])' index.html
          grep -Eiq '</html>' index.html
          grep -Eiq '<head([[:space:]>])' index.html
          grep -Eiq '</head>' index.html
          grep -Eiq '<body([[:space:]>])' index.html
          grep -Eiq '</body>' index.html
          echo "HTML structure validation successful!"

      - name: Verify student registration form
        shell: bash
        run: |
          set -e
          grep -Eiq '<form([[:space:]>])' index.html
          grep -Eiq 'name="name"' index.html
          grep -Eiq 'type="email"' index.html
          grep -Eiq 'name="email"' index.html
          grep -Eiq 'required' index.html
          echo "Student registration form checks passed!"

      - name: Verify registration button
        shell: bash
        run: |
          set -e
          grep -Eiq 'type="submit"' index.html
          grep -Eiq 'Register' index.html
          echo "Registration button check passed!"










          
