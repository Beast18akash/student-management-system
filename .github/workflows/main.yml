name: Student Management System CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f index.html
          test -f README.md
          echo "All project files exist!"

      - name: Validate HTML file
        run: |
          grep -q "<html" index.html
          grep -q "</html>" index.html
          echo "HTML validation successful!"
